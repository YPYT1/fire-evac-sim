repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        additional_dependencies: []
        files: "\\.(json|ya?ml|md)$"
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: bun run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|vue)$
      - id: frontend-format
        name: frontend prettier check
        entry: bun run format
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|vue|js|json|css|scss)$
